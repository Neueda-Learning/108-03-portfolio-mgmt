services:
  db:
    image: mysql:8.4
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portfoliodb
      MYSQL_USER: portuser
      MYSQL_PASSWORD: portuser
      MYSQL_ROOT_PASSWORD: n3u3da!
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pn3u3da!"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/portfoliodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: portuser
      SPRING_DATASOURCE_PASSWORD: portuser
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  mysql_data:
