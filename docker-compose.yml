services:
  db:
    image: mysql:8.4
    pull_policy: if_not_present
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portfoliodb
      MYSQL_USER: portuser
      MYSQL_PASSWORD: portuser
      MYSQL_ROOT_PASSWORD: n3u3da!
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pn3u3da!"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    pull_policy: if_not_present
    container_name: portfolio-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-model-init:
    image: ollama/ollama:latest
    pull_policy: if_not_present
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      ollama list | grep -q "${OLLAMA_MODEL:-qwen2.5:0.5b}" ||
      ollama pull "${OLLAMA_MODEL:-qwen2.5:0.5b}"
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-model-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/portfoliodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: portuser
      SPRING_DATASOURCE_PASSWORD: portuser


      # Local LLM settings (backend should read these)
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  mysql_data:
    name: portfolio_mysql_data
  ollama_data:
    # Fixed volume name keeps model cache across compose project/branch name changes.
    name: portfolio_ollama_data
